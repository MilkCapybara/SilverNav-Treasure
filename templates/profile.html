<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>银航宝 · 船舶画像</title>
    <link rel="stylesheet" href="/static/css/dashboard.css">
    <link rel="stylesheet" href="/static/css/dashboard-controls.css">
    <link rel="stylesheet" href="/static/css/profile.css">
    <link rel="stylesheet" href="/static/css/sci-fi-select.css">
    <script src="/static/js/sci-fi-select.js"></script>
</head>
<body class="dashboard-body profile-page">
    <div class="skyline" aria-hidden="true"></div>
    <div class="grid-glow" aria-hidden="true"></div>
    <div class="particles" id="particles"></div>

    <header class="top-bar">
        <div class="top-left">
            <button class="back-btn" id="backBtn" data-tip="返回总览大屏">返回大屏</button>
            <div class="date-display">
                <span class="date-label">数据基准日：</span>
                <span class="date-value" id="baseDateValue">--</span>
            </div>
        </div>
        <div class="top-center">
            <h1>🚢 船舶画像</h1>
            <p id="profileTitle">综合船舶数据分析与画像</p>
        </div>
        <div class="top-right">
            <div class="clock" id="cnClock">--</div>
            <div class="meta">
                <span class="tag">数据源：MongoDB + PostgreSQL</span>
            </div>
        </div>
    </header>

    <main class="profile-content">
        <!-- 总览统计卡片 -->
        <section class="profile-stats">
            <div class="stat-card glow-card">
                <div class="stat-icon">🚢</div>
                <div class="stat-info">
                    <div class="stat-label">船舶总数</div>
                    <div class="stat-value" id="totalVessels">--</div>
                </div>
            </div>
            <div class="stat-card glow-card">
                <div class="stat-icon">⚡</div>
                <div class="stat-info">
                    <div class="stat-label">活跃船舶</div>
                    <div class="stat-value" id="activeVessels">--</div>
                    <div class="stat-desc">近7天有轨迹</div>
                </div>
            </div>
            <div class="stat-card glow-card">
                <div class="stat-icon">📊</div>
                <div class="stat-info">
                    <div class="stat-label">船舶类型</div>
                    <div class="stat-value" id="shipTypeCount">--</div>
                    <div class="stat-desc">种类统计</div>
                </div>
            </div>
            <div class="stat-card glow-card">
                <div class="stat-icon">🌍</div>
                <div class="stat-info">
                    <div class="stat-label">船旗国</div>
                    <div class="stat-value" id="flagCount">--</div>
                    <div class="stat-desc">国家统计</div>
                </div>
            </div>
        </section>

        <!-- 第一行：船舶类型分布 + 船旗国分布 -->
        <div class="profile-row">
            <section class="card profile-card glow-border">
                <h3>📊 船舶类型分布</h3>
                <div id="shipTypeChart" class="chart-container"></div>
            </section>

            <section class="card profile-card glow-border">
                <h3>🌍 船旗国分布</h3>
                <div id="flagChart" class="chart-container"></div>
            </section>
        </div>

        <!-- 第二行：活跃度Top10 + 速度分布 -->
        <div class="profile-row">
            <section class="card profile-card glow-border">
                <h3>🏆 船舶活跃度Top10</h3>
                <div class="table-container">
                    <table class="profile-table">
                        <thead>
                            <tr>
                                <th>排名</th>
                                <th>IMO编号</th>
                                <th>船名</th>
                                <th>船舶类型</th>
                                <th>轨迹点数</th>
                                <th>平均速度</th>
                            </tr>
                        </thead>
                        <tbody id="activityTableBody">
                            <tr><td colspan="6" style="text-align: center; padding: 40px;">加载中...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <section class="card profile-card glow-border">
                <h3>⚡ 速度分布统计</h3>
                <div id="speedChart" class="chart-container"></div>
                <!-- 星座航母装饰 -->
                <div class="carrier-constellation">
                    <svg viewBox="0 0 400 150" class="carrier-svg">
                        <!-- 航母甲板星点 -->
                        <circle cx="200" cy="90" r="2.5" class="star-point" style="animation-delay: 0s"/>
                        <circle cx="150" cy="92" r="2.5" class="star-point" style="animation-delay: 0.15s"/>
                        <circle cx="250" cy="92" r="2.5" class="star-point" style="animation-delay: 0.3s"/>
                        <circle cx="120" cy="95" r="2.5" class="star-point" style="animation-delay: 0.45s"/>
                        <circle cx="280" cy="95" r="2.5" class="star-point" style="animation-delay: 0.6s"/>
                        <circle cx="100" cy="100" r="2.5" class="star-point" style="animation-delay: 0.75s"/>
                        <circle cx="300" cy="100" r="2.5" class="star-point" style="animation-delay: 0.9s"/>

                        <!-- 舰岛星点 -->
                        <circle cx="220" cy="60" r="2.5" class="star-point" style="animation-delay: 1.05s"/>
                        <circle cx="210" cy="70" r="2.5" class="star-point" style="animation-delay: 1.2s"/>
                        <circle cx="230" cy="70" r="2.5" class="star-point" style="animation-delay: 1.35s"/>
                        <circle cx="220" cy="80" r="2.5" class="star-point" style="animation-delay: 1.5s"/>

                        <!-- 舰首星点 -->
                        <circle cx="90" cy="105" r="2.5" class="star-point" style="animation-delay: 1.65s"/>
                        <circle cx="85" cy="100" r="2" class="star-point" style="animation-delay: 1.8s"/>

                        <!-- 舰尾星点 -->
                        <circle cx="310" cy="105" r="2.5" class="star-point" style="animation-delay: 1.95s"/>
                        <circle cx="315" cy="100" r="2" class="star-point" style="animation-delay: 2.1s"/>

                        <!-- 连接线（甲板轮廓） -->
                        <line x1="85" y1="100" x2="100" y2="100" class="constellation-line"/>
                        <line x1="100" y1="100" x2="120" y2="95" class="constellation-line"/>
                        <line x1="120" y1="95" x2="150" y2="92" class="constellation-line"/>
                        <line x1="150" y1="92" x2="200" y2="90" class="constellation-line"/>
                        <line x1="200" y1="90" x2="250" y2="92" class="constellation-line"/>
                        <line x1="250" y1="92" x2="280" y2="95" class="constellation-line"/>
                        <line x1="280" y1="95" x2="300" y2="100" class="constellation-line"/>
                        <line x1="300" y1="100" x2="315" y2="100" class="constellation-line"/>

                        <!-- 甲板底部 -->
                        <line x1="90" y1="105" x2="310" y2="105" class="constellation-line"/>
                        <line x1="85" y1="100" x2="90" y2="105" class="constellation-line"/>
                        <line x1="315" y1="100" x2="310" y2="105" class="constellation-line"/>

                        <!-- 舰岛结构 -->
                        <line x1="220" y1="80" x2="220" y2="60" class="constellation-line"/>
                        <line x1="220" y1="60" x2="210" y2="70" class="constellation-line"/>
                        <line x1="220" y1="60" x2="230" y2="70" class="constellation-line"/>
                        <line x1="210" y1="70" x2="220" y2="80" class="constellation-line"/>
                        <line x1="230" y1="70" x2="220" y2="80" class="constellation-line"/>
                        <line x1="220" y1="80" x2="200" y2="90" class="constellation-line"/>

                        <!-- 波浪线 -->
                        <path d="M 60 115 Q 80 110, 100 115 T 140 115 T 180 115 T 220 115 T 260 115 T 300 115 T 340 115" class="wave-line" style="animation-delay: 0s"/>
                        <path d="M 50 120 Q 70 115, 90 120 T 130 120 T 170 120 T 210 120 T 250 120 T 290 120 T 330 120" class="wave-line" style="animation-delay: 0.5s"/>
                        <path d="M 40 125 Q 60 120, 80 125 T 120 125 T 160 125 T 200 125 T 240 125 T 280 125 T 320 125" class="wave-line" style="animation-delay: 1s"/>
                    </svg>
                </div>
            </section>
        </div>

        <!-- 第三行：船舶搜索与详情 -->
        <section class="card profile-card full-width glow-border">
            <h3>🔍 船舶详细画像</h3>
            <div class="search-bar">
                <input type="text" id="vesselSearch" placeholder="输入IMO编号搜索船舶..." class="glow-input" />
                <button class="search-btn glow-btn" id="searchBtn">搜索</button>
            </div>
            <div id="vesselDetail" class="vessel-detail">
                <div class="empty-state">
                    <div class="empty-icon">🚢</div>
                    <p>请输入IMO编号搜索船舶</p>
                </div>
            </div>
        </section>
    </main>

    <div class="toast" id="profileToast" role="status" aria-live="polite"></div>

    <script src="/static/js/dashboard/state.js"></script>
    <script src="/static/js/dashboard/utils.js"></script>
    <script src="/static/js/profile.js"></script>
</body>
</html>
